<template>
    <!--component body start-->
      <div>
        <!--section 1-->
    <template lwc:if={showWelcomeMessage}>  
      <!-- <div class = "slds-box">Hello world {greetCmp}</div>-->
      <c-sample-child-cmp greet-cmp={greetCmp}></c-sample-child-cmp> 
    <br/>
      <br/>

        <div>
            <lightning-input label="Enter message" 
               type="text" value={greetCmp} onchange={handleMessage}>
            </lightning-input>
            <lightning-button label="update" onclick={handleChangeMessage}></lightning-button>
        </div>
        <!--student list-->
        <ul>
            <template for:each={studentsList} for:item="student">
                <li key={student.rollno}>
                 "name":   {student.name}  "age": {student.age}  "grade": {student.grade}
                </li>
            </template>
        </ul>   
        <lightning-button label="Add Student" onclick={handleAddStudent}></lightning-button>
        </template>
        <!--section 1-->
        
        
        
         
        

        <!--section 2-->
        <template lwc:elseif={showSecondMessage}>    
       <div class ="custom-class">Hello all {greetCmp}</div>
       <br/>
        <div>
            <lightning-input label="Enter message" 
               type="text" value={greetCmp} onchange={handleMessage}>
            </lightning-input>
            <lightning-button label="update" onclick={handleMessageChange}></lightning-button>
        </div>
        </template>
        <!--section 2-->

        <!--section 3-->
        <template lwc:else>
       <div style="border: 1px solid gray; width: 100%;">Hello indian {greetCmp}</div>
       <br/>
        <div>
            <lightning-input  label="Enter message" 
               type="text" value={greetCmp} onchange={handleMessage}>
            </lightning-input>
            <lightning-button label="update" onclick={handleMessageChange}></lightning-button>
        </div>
        </template>
        <!--section 3-->
    <lightning-button label="next" onclick={handleNext}></lightning-button>
    <div>&nbsp;</div>
    <lightning-button label="final" onclick={handleFinal}></lightning-button>
    </div>

     <!--component body end-->
</template>
